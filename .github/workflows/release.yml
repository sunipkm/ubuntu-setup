name: Release

# Publish a GitHub release whenever a version tag is pushed.
#   vX.Y.Z       -> stable release
#   vX.Y.Z-preN  -> pre-release
# Create and push tags with ./craft_release.sh <tag>.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pre[0-9]+$ ]]; then
            echo "IS_PRERELEASE=true" >>"$GITHUB_ENV"
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "IS_PRERELEASE=false" >>"$GITHUB_ENV"
          else
            echo "::error::Tag '$RELEASE_TAG' is not vX.Y.Z or vX.Y.Z-preN"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Syntax-check scripts
        run: |
          set -e
          for f in *.sh windows/*.sh; do
            echo "bash -n $f"
            bash -O extglob -n "$f"
          done
          zsh -n dotfiles/.zshrc 2>/dev/null || { sudo apt-get install -y zsh >/dev/null && zsh -n dotfiles/.zshrc; }

      - name: Build dotfiles installer
        run: |
          set -euo pipefail
          bash ./build_dotfiles_installer.sh "$RELEASE_TAG"
          test -s dotfiles_installer.sh

      - name: Verify installer payload
        run: |
          set -euo pipefail
          grep -q "^DOTFILES_VERSION=\"$RELEASE_TAG\"" dotfiles_installer.sh
          end=$(grep -m 2 -n ___END_OF_SHELL_SCRIPT___ dotfiles_installer.sh | cut -d: -f1 | tail -1)
          tail -n +"$((end + 1))" dotfiles_installer.sh | base64 -d | tar -tz >payload.lst
          grep -qx 'dotfiles/.zshrc' payload.lst
          echo "Payload OK: $(wc -l <payload.lst) entries"

      - name: Publish release
        run: |
          set -euo pipefail
          # craft_release.sh force-pushes tags, so replace any existing release.
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG exists; deleting it first."
            gh release delete "$RELEASE_TAG" --yes
          fi
          args=(--title "$RELEASE_TAG" --verify-tag)
          if [[ "$IS_PRERELEASE" == true ]]; then
            args+=(--prerelease --notes "Pre-release $RELEASE_TAG")
          else
            args+=(--latest --notes "Release $RELEASE_TAG")
          fi
          gh release create "$RELEASE_TAG" dotfiles_installer.sh "${args[@]}"
